# RepoMonitoring — Redis as a DURABLE cache store (not an evictable cache).
# Rendered by infra/stack.sh with __PORT__/__DIR__ substituted; the effective file
# is written to ~/repomon/redis.conf. Keep the data dir on WSL2 ext4, never /mnt/c.

port __PORT__
bind 127.0.0.1
daemonize yes
pidfile __DIR__/redis.pid
logfile __DIR__/redis.log
dir __DIR__

# AOF: every write is logged, so the cache reloads WARM after any restart
# (Windows updates, WSL shutdown). This is the whole point of persistence here.
appendonly yes
appendfsync everysec

# RDB snapshots as a second durability layer.
save 900 1
save 300 10
save 60 10000

# Entries here are authoritative recreatable-cache data — never evict them.
maxmemory-policy noeviction
